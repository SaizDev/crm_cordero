# Applies database migrations to PRODUCTION after they reach main.
# Setup (human, once):
#   1. GitHub > Settings > Environments > "production": add required reviewers.
#   2. Environment secrets: SUPABASE_ACCESS_TOKEN (personal access token), SUPABASE_DB_PASSWORD.
#   3. Environment variable: SUPABASE_PROJECT_ID (production project ref).
# Owner: devops-engineer. Agents never run `supabase db push`; this workflow (with approval) does.
name: Database deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN secret missing"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "SUPABASE_PROJECT_ID variable missing"; exit 1; }
      - name: Link project
        run: pnpm supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations (plan)
        run: pnpm supabase migration list --linked
      - name: Dry run
        run: pnpm supabase db push --linked --dry-run
      - name: Apply migrations
        run: pnpm supabase db push --linked
