# CI: quality gates for every pull request and for main.
# Owner: devops-engineer. Actions are pinned to commit SHAs (Dependabot keeps them current).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Public, non-secret placeholders so the build can validate env at build time.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harness configuration matches files
        run: node .claude/harness/harness.mjs render --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Database artifacts match migrations (offline, in-memory Postgres)
        run: pnpm db:check
      - name: Database tests (pgTAP, offline)
        run: pnpm db:test
      - run: pnpm build

  # Safety net on real Supabase (Postgres 17 with the platform schemas). Docker runs on the
  # GitHub runner only; developers and agents never need it.
  database:
    name: Real Supabase validation (migrations, seed, pgTAP, advisors)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies all migrations from an empty database)
        run: pnpm supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime
      - name: pgTAP tests on real Supabase
        run: pnpm supabase test db
      - name: Security advisors
        run: pnpm supabase db advisors --local --type security --fail-on error

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Export local Supabase connection values
        run: |
          pnpm supabase status -o env > .supabase-status.env
          set -a; . ./.supabase-status.env; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          rm -f .supabase-status.env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
