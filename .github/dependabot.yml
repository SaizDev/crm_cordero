# Weekly dependency updates, grouped to keep pull requests reviewable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*", "supabase"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/*", "jsdom", "@axe-core/*"]
      tooling:
        patterns: ["eslint*", "prettier*", "typescript", "@types/*", "tailwindcss", "@tailwindcss/*"]
    labels: ["dependencies"]
    # Hold majors of these three tooling packages (spec 001):
    # - typescript 7 is not supported by typescript-eslint 8, used by eslint-config-next.
    # - eslint 10 is tied to the same Next.js lint toolchain.
    # - @types/node must match the Node major pinned in .nvmrc (22).
    # Minor and patch updates still arrive in the "tooling" group.
    # A dedicated upgrade spec lifts a rule when the toolchain supports the new major.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
